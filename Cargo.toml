[package]
name = "riptide"
version = "0.1.0"
edition = "2024"
description = "Riptide — Native Rust YouTube Music client built with Zed's GPUI, modeled after Tidal, powered underneath by the real YouTube Music webapp."

[dependencies]
anyhow = "1.0"
dirs = "6.0"
futures = "0.3"
gpui = "0.2.2"
http = "1.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tao = "0.34"
tokio = { version = "1.43", features = ["rt-multi-thread", "sync"] }
urlencoding = "2.1"
wry = "0.53"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
